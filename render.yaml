services:
  - type: web
    name: radiantai-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://radiantai-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: BACKEND_PUBLIC_URL
        value: https://radiantai-backend.onrender.com
      - key: ENABLE_LIVE_PRODUCT_SEARCH
        value: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_UPLOAD_PREFIX
        value: uploads

  - type: web
    name: radiantai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://radiantai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
